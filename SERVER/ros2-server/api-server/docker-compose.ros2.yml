version: '3.8'

# ROS2 환경을 사용하는 경우의 docker-compose 설정
# 
# 주의: network_mode: "host"와 networks는 상호 배타적이므로
#       오버라이드 파일 대신 독립적인 파일을 사용하세요:
#       docker-compose -f docker-compose.ros2.standalone.yml up -d
#
# 전제 조건:
# 1. 호스트에 ROS2가 설치되어 있음
# 2. colcon build가 완료되어 있음
# 3. LCD 컨트롤러 서버가 실행 중임 (ros2 run pinky_lcd_display_controller lcd_controller_server)

# 이 파일은 더 이상 사용하지 않습니다.
# 대신 docker-compose.ros2.standalone.yml을 사용하세요.

