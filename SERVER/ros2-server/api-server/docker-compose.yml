version: '3.8'

services:
  # FastAPI 서버
  ros2-api-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ros2-api-server
    ports:
      - "${SERVER_PORT:-8003}:8000"  # 외부 포트 8003 (llm-gateway:8001, iot-data-server:8000과 충돌 방지)
    expose:
      - "8000"  # Caddy가 내부 네트워크로 접근
    env_file:
      - .env.local
    volumes:
      - ./logs:/app/logs
      - ./src:/app/src  # 개발 시 소스 코드 동기화
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    # networks 설정 (ROS2 모드에서는 오버라이드 파일에서 제거됨)
    networks:
      - ros2-api-network
    # ROS2 통신을 위한 설정
    # 네트워크 모드: host 또는 ROS2 브리지 서버 사용
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Redis 컨테이너 (선택적)
  redis:
    image: redis:7-alpine
    container_name: ros2-api-redis
    ports:
      - "${REDIS_EXTERNAL_PORT:-16381}:6379"  # 외부 포트 16381 (llm-gateway:16379와 충돌 방지)
    volumes:
      - redis-data:/data
    command: >
      sh -c "
      if [ -n \"$$REDIS_PASSWORD\" ]; then
        redis-server --requirepass $$REDIS_PASSWORD --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --loglevel notice
      else
        redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --loglevel notice
      fi
      "
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli -a $$REDIS_PASSWORD ping; else redis-cli ping; fi"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - ros2-api-network

  # Caddy 리버스 프록시
  # 주의: 80, 443 포트는 다른 프로젝트와 충돌할 수 있음
  # 필요시 다른 포트 사용 (예: 8080:80, 8443:443)
  caddy:
    image: caddy:2-alpine
    container_name: ros2-api-caddy
    ports:
      - "${CADDY_HTTP_PORT:-8080}:80"      # HTTP 포트 (기본 8080)
      - "${CADDY_HTTPS_PORT:-8443}:443"    # HTTPS 포트 (기본 8443)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - ros2-api-server
    restart: unless-stopped
    networks:
      - ros2-api-network

volumes:
  caddy-data:
    driver: local
  caddy-config:
    driver: local
  redis-data:
    driver: local

networks:
  ros2-api-network:
    driver: bridge

