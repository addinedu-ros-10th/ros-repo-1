version: '3.8'

services:
  # FastAPI 서버
  llm-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llm-gateway
    ports:
      - "${SERVER_PORT:-8001}:8000"  # 외부 포트 8001 유지 (직접 접속용)
    expose:
      - "8000"  # Caddy가 내부 네트워크로 접근하기 위한 포트
    # environment:
    #   # OpenAI API 설정
    #   - OPENAI_API_KEY=${OPENAI_API_KEY}
      
    #   # 서버 설정
    #   - SERVER_HOST=0.0.0.0
    #   - SERVER_PORT=8000
    #   - DEBUG=${DEBUG:-false}
    #   - RELOAD=false
      
    #   # CORS 설정
    #   - CORS_ORIGINS=${CORS_ORIGINS:-*}
      
    #   # ChatGPT 기본 설정
    #   - DEFAULT_CHAT_MODEL=${DEFAULT_CHAT_MODEL:-gpt-4o-mini}
    #   - DEFAULT_SYSTEM_PROMPT=${DEFAULT_SYSTEM_PROMPT:-당신은 친절한 한국어 AI 어시스턴트입니다.}
      
    #   # TTS 기본 설정
    #   - DEFAULT_TTS_VOICE=${DEFAULT_TTS_VOICE:-alloy}
    #   - DEFAULT_TTS_MODEL=${DEFAULT_TTS_MODEL:-tts-1}
      
    #   # Redis 설정
    #   - REDIS_HOST=redis
    #   - REDIS_PORT=6379
    #   - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      
    #   # 데이터베이스 설정 (외부 DB 사용)
    #   - DB_URL=${DB_URL:-}
    #   - DB_HOST=${DB_HOST:-}
    #   - DB_PORT=${DB_PORT:-}
    #   - DB_NAME=${DB_NAME:-}
    #   - DB_USER=${DB_USER:-}
    #   - DB_PASSWORD=${DB_PASSWORD:-}
    env_file:
      - .env.local
    volumes:
      # 로그 저장 (선택사항)
      - ./logs:/app/logs
      # 테스트 파일 (정적 파일 서빙용) - 개발 중 변경사항 반영
      - ./tests:/app/tests
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    extra_hosts:
      # Docker 컨테이너에서 호스트 머신의 localhost에 접근하기 위한 설정
      # Linux에서는 host.docker.internal이 자동으로 지원되지 않으므로 명시적으로 추가
      - "host.docker.internal:host-gateway"
    networks:
      - llm-gateway-network

  # Redis 컨테이너
  redis:
    image: redis:7-alpine
    container_name: llm-gateway-redis
    ports:
      - "${REDIS_EXTERNAL_PORT:-16379}:6379"
    command: >
      sh -c "
      # 메모리 overcommit 설정 (호스트에서 설정 필요: sudo sysctl vm.overcommit_memory=1)
      # 컨테이너 내부에서는 권한 없이 설정 불가하므로 무시
      sysctl vm.overcommit_memory=1 2>/dev/null || true
      # Redis 서버 시작 (경고 메시지 억제를 위해 로그 레벨 조정)
      if [ -n \"$$REDIS_PASSWORD\" ]; then
        redis-server 
          --requirepass $$REDIS_PASSWORD 
          --appendonly yes 
          --maxmemory 256mb 
          --maxmemory-policy allkeys-lru 
          --save 60 1000 
          --stop-writes-on-bgsave-error no
          --loglevel notice
      else
        redis-server 
          --appendonly yes 
          --maxmemory 256mb 
          --maxmemory-policy allkeys-lru 
          --save 60 1000 
          --stop-writes-on-bgsave-error no
          --loglevel notice
      fi
      "
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    volumes:
      - redis-data:/data
    # 참고: vm.overcommit_memory는 호스트 레벨 커널 파라미터이므로
    # 컨테이너에서 직접 설정할 수 없습니다. 호스트에서 수동으로 설정하거나
    # 컨테이너 내부에서 시도하되 실패해도 무시됩니다 (command에서 처리됨).
    # 호스트에서 설정하려면: sudo sysctl vm.overcommit_memory=1
    # 메모리 제한 설정 (선택사항)
    # mem_limit: 512m
    # mem_reservation: 256m
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli -a $$REDIS_PASSWORD ping; else redis-cli ping; fi"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - llm-gateway-network

  # Caddy 리버스 프록시 (SSL/TLS 자동 적용)
  caddy:
    image: caddy:2-alpine
    container_name: llm-gateway-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3 지원
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - llm-gateway
    restart: unless-stopped
    networks:
      - llm-gateway-network

volumes:
  caddy-data:
    driver: local
  caddy-config:
    driver: local
  redis-data:
    driver: local

networks:
  llm-gateway-network:
    driver: bridge


