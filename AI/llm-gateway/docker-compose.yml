version: '3.8'

services:
  # FastAPI 서버
  llm-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llm-gateway
    ports:
      - "${SERVER_PORT:-8000}:8000"
    # environment:
    #   # OpenAI API 설정
    #   - OPENAI_API_KEY=${OPENAI_API_KEY}
      
    #   # 서버 설정
    #   - SERVER_HOST=0.0.0.0
    #   - SERVER_PORT=8000
    #   - DEBUG=${DEBUG:-false}
    #   - RELOAD=false
      
    #   # CORS 설정
    #   - CORS_ORIGINS=${CORS_ORIGINS:-*}
      
    #   # ChatGPT 기본 설정
    #   - DEFAULT_CHAT_MODEL=${DEFAULT_CHAT_MODEL:-gpt-4o-mini}
    #   - DEFAULT_SYSTEM_PROMPT=${DEFAULT_SYSTEM_PROMPT:-당신은 친절한 한국어 AI 어시스턴트입니다.}
      
    #   # TTS 기본 설정
    #   - DEFAULT_TTS_VOICE=${DEFAULT_TTS_VOICE:-alloy}
    #   - DEFAULT_TTS_MODEL=${DEFAULT_TTS_MODEL:-tts-1}
      
    #   # Redis 설정
    #   - REDIS_HOST=redis
    #   - REDIS_PORT=6379
    #   - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      
    #   # 데이터베이스 설정 (외부 DB 사용)
    #   - DB_URL=${DB_URL:-}
    #   - DB_HOST=${DB_HOST:-}
    #   - DB_PORT=${DB_PORT:-}
    #   - DB_NAME=${DB_NAME:-}
    #   - DB_USER=${DB_USER:-}
    #   - DB_PASSWORD=${DB_PASSWORD:-}
    env_file:
      - .env.local
    volumes:
      # 로그 저장 (선택사항)
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - llm-gateway-network

  # Redis 컨테이너
  redis:
    image: redis:7-alpine
    container_name: llm-gateway-redis
    ports:
      - "${REDIS_EXTERNAL_PORT:-6379}:6379"
    command: >
      sh -c "
      if [ -n \"$$REDIS_PASSWORD\" ]; then
        redis-server --requirepass $$REDIS_PASSWORD --appendonly yes
      else
        redis-server --appendonly yes
      fi
      "
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - llm-gateway-network

volumes:
  redis-data:
    driver: local

networks:
  llm-gateway-network:
    driver: bridge


