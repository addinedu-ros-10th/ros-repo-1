<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>채팅 인터페이스</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            background-color: #343541;
            color: #ececf1;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 헤더 */
        .header {
            background-color: #202123;
            padding: 12px 16px;
            border-bottom: 1px solid #4d4d4f;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        .header-controls select {
            background-color: #40414f;
            color: #ececf1;
            border: 1px solid #565869;
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 14px;
            cursor: pointer;
            min-width: 200px;
        }

        .header-controls select:hover {
            background-color: #4a4b5a;
        }

        .header-controls button {
            background-color: #565869;
            color: #ececf1;
            border: none;
            border-radius: 6px;
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .header-controls button:hover {
            background-color: #6b6c7d;
        }

        .voice-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .voice-toggle input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .voice-toggle label {
            font-size: 14px;
            cursor: pointer;
        }

        /* 채팅 영역 */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 0;
            scroll-behavior: smooth;
        }

        .chat-container::-webkit-scrollbar {
            width: 8px;
        }

        .chat-container::-webkit-scrollbar-track {
            background: #202123;
        }

        .chat-container::-webkit-scrollbar-thumb {
            background: #565869;
            border-radius: 4px;
        }

        .chat-container::-webkit-scrollbar-thumb:hover {
            background: #6b6c7d;
        }

        .message {
            display: flex;
            padding: 20px 0;
            border-bottom: 1px solid #4d4d4f;
        }

        .message:last-child {
            border-bottom: none;
        }

        .message.user {
            background-color: #343541;
        }

        .message.assistant {
            background-color: #444654;
        }

        .message-content {
            max-width: 768px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            gap: 20px;
            padding: 0 20px;
        }

        .message-avatar {
            width: 30px;
            height: 30px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
        }

        .message.user .message-avatar {
            background-color: #19c37d;
        }

        .message.assistant .message-avatar {
            background-color: #ab68ff;
        }

        .message-text {
            flex: 1;
            line-height: 1.75;
            font-size: 16px;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .message-text code {
            background-color: #2d2d2d;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }

        .message-text pre {
            background-color: #2d2d2d;
            padding: 12px;
            border-radius: 6px;
            overflow-x: auto;
            margin: 12px 0;
        }

        /* 입력 영역 */
        .input-container {
            background-color: #202123;
            border-top: 1px solid #4d4d4f;
            padding: 16px;
        }

        .input-wrapper {
            max-width: 768px;
            margin: 0 auto;
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .input-area {
            flex: 1;
            background-color: #40414f;
            border: 1px solid #565869;
            border-radius: 12px;
            padding: 12px 16px;
            min-height: 52px;
            max-height: 200px;
            overflow-y: auto;
            font-size: 16px;
            color: #ececf1;
            resize: none;
            font-family: inherit;
        }

        .input-area:focus {
            outline: none;
            border-color: #19c37d;
        }

        .input-area::placeholder {
            color: #8e8ea0;
        }

        .send-button {
            background-color: #19c37d;
            color: white;
            border: none;
            border-radius: 8px;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.2s;
            flex-shrink: 0;
        }

        .send-button:hover:not(:disabled) {
            background-color: #15a169;
        }

        .send-button:disabled {
            background-color: #565869;
            cursor: not-allowed;
        }

        .send-button svg {
            width: 20px;
            height: 20px;
        }

        /* 음성 인터페이스 */
        .voice-interface {
            display: none;
            background-color: #202123;
            border-top: 1px solid #4d4d4f;
            padding: 16px;
        }

        .voice-interface.active {
            display: block;
        }

        .voice-controls {
            max-width: 768px;
            margin: 0 auto;
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: center;
        }

        .voice-button {
            background-color: #40414f;
            color: #ececf1;
            border: 1px solid #565869;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .voice-button:hover {
            background-color: #4a4b5a;
        }

        .voice-button.recording {
            background-color: #ef4444;
            border-color: #ef4444;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.7;
            }
        }

        .voice-status {
            color: #8e8ea0;
            font-size: 14px;
        }

        /* 모달 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            overflow-y: auto;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background-color: #202123;
            border: 1px solid #4d4d4f;
            border-radius: 12px;
            width: 90%;
            max-width: 800px;
            max-height: 90vh;
            margin: 20px;
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            padding: 20px;
            border-bottom: 1px solid #4d4d4f;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            font-size: 20px;
            font-weight: 600;
        }

        .modal-close {
            background: none;
            border: none;
            color: #ececf1;
            font-size: 24px;
            cursor: pointer;
            padding: 0;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
        }

        .modal-close:hover {
            background-color: #40414f;
        }

        .modal-body {
            padding: 20px;
            overflow-y: auto;
            flex: 1;
        }

        .prompt-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .prompt-item {
            background-color: #343541;
            border: 1px solid #4d4d4f;
            border-radius: 8px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .prompt-info {
            flex: 1;
        }

        .prompt-name {
            font-weight: 600;
            margin-bottom: 4px;
        }

        .prompt-description {
            color: #8e8ea0;
            font-size: 14px;
        }

        .prompt-actions {
            display: flex;
            gap: 8px;
        }

        .prompt-actions button {
            background-color: #40414f;
            color: #ececf1;
            border: 1px solid #565869;
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 14px;
            cursor: pointer;
        }

        .prompt-actions button:hover {
            background-color: #4a4b5a;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            background-color: #40414f;
            color: #ececf1;
            border: 1px solid #565869;
            border-radius: 6px;
            padding: 10px 12px;
            font-size: 14px;
            font-family: inherit;
        }

        .form-group textarea {
            min-height: 120px;
            resize: vertical;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #19c37d;
        }

        .form-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #565869;
            border-top-color: #19c37d;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <!-- 헤더 -->
    <div class="header">
        <div class="header-controls">
            <select id="systemPromptSelect">
                <option value="">기본 프롬프트</option>
            </select>
            <button onclick="openPromptManager()">프롬프트 관리</button>
            <div class="voice-toggle">
                <input type="checkbox" id="voiceInterfaceToggle" onchange="toggleVoiceInterface()">
                <label for="voiceInterfaceToggle">음성 인터페이스</label>
            </div>
        </div>
    </div>

    <!-- 채팅 영역 -->
    <div class="chat-container" id="chatContainer">
        <div class="message assistant">
            <div class="message-content">
                <div class="message-avatar">AI</div>
                <div class="message-text">안녕하세요! 무엇을 도와드릴까요?</div>
            </div>
        </div>
    </div>

    <!-- 입력 영역 -->
    <div class="input-container">
        <div class="input-wrapper">
            <textarea 
                id="messageInput" 
                class="input-area" 
                placeholder="메시지를 입력하세요..." 
                rows="1"
                onkeydown="handleKeyDown(event)"
                oninput="autoResize(this)"
            ></textarea>
            <button class="send-button" id="sendButton" onclick="sendMessage()" disabled>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
                </svg>
            </button>
        </div>
    </div>

    <!-- 음성 인터페이스 -->
    <div class="voice-interface" id="voiceInterface">
        <div class="voice-controls">
            <button class="voice-button" id="voiceRecordButton" onclick="toggleVoiceRecording()">
                🎤 음성 입력
            </button>
            <div class="voice-status" id="voiceStatus">대기 중...</div>
        </div>
    </div>

    <!-- System Prompt 관리 모달 -->
    <div class="modal" id="promptManagerModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>System Prompt 관리</h2>
                <button class="modal-close" onclick="closePromptManager()">×</button>
            </div>
            <div class="modal-body">
                <div style="margin-bottom: 16px;">
                    <button onclick="openPromptForm()" style="background-color: #19c37d; color: white; border: none; border-radius: 6px; padding: 10px 20px; font-size: 14px; cursor: pointer;">
                        + 새 프롬프트 작성
                    </button>
                </div>
                <div class="prompt-list" id="promptList">
                    <div class="loading"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 프롬프트 작성/편집 모달 -->
    <div class="modal" id="promptFormModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="promptFormTitle">새 프롬프트 작성</h2>
                <button class="modal-close" onclick="closePromptForm()">×</button>
            </div>
            <div class="modal-body">
                <form id="promptForm" onsubmit="savePrompt(event)">
                    <div class="form-group">
                        <label>이름 *</label>
                        <input type="text" id="promptName" required>
                    </div>
                    <div class="form-group">
                        <label>내용 *</label>
                        <textarea id="promptContent" required></textarea>
                    </div>
                    <div class="form-group">
                        <label>설명</label>
                        <textarea id="promptDescription"></textarea>
                    </div>
                    <div class="form-group">
                        <label>
                            <input type="checkbox" id="promptIsDefault" style="width: auto; margin-right: 8px;">
                            기본 프롬프트로 설정
                        </label>
                    </div>
                    <div class="form-actions">
                        <button type="button" onclick="closePromptForm()" style="background-color: #40414f; color: #ececf1; border: 1px solid #565869; border-radius: 6px; padding: 10px 20px; font-size: 14px; cursor: pointer;">
                            취소
                        </button>
                        <button type="submit" style="background-color: #19c37d; color: white; border: none; border-radius: 6px; padding: 10px 20px; font-size: 14px; cursor: pointer;">
                            저장
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        let currentSessionId = 'chat-' + Date.now();
        let isRecording = false;
        let mediaRecorder = null;
        let audioChunks = [];
        let editingPromptId = null;

        // 페이지 로드 시 초기화
        window.addEventListener('DOMContentLoaded', async () => {
            await loadSystemPrompts();
            await loadLastUsedPrompt();
            document.getElementById('messageInput').disabled = false;
            document.getElementById('sendButton').disabled = false;
        });

        // System Prompt 목록 로드
        async function loadSystemPrompts() {
            try {
                const response = await fetch(`${API_BASE}/api/system-prompts`);
                const data = await response.json();
                
                if (data.success) {
                    const select = document.getElementById('systemPromptSelect');
                    select.innerHTML = '<option value="">기본 프롬프트</option>';
                    
                    data.prompts.forEach(prompt => {
                        const option = document.createElement('option');
                        option.value = prompt.id;
                        option.textContent = prompt.name + (prompt.is_default ? ' (기본)' : '');
                        select.appendChild(option);
                    });
                }
            } catch (error) {
                console.error('Failed to load system prompts:', error);
            }
        }

        // 마지막 사용 프롬프트 로드
        async function loadLastUsedPrompt() {
            try {
                const response = await fetch(`${API_BASE}/api/system-prompts/last-used/${currentSessionId}`);
                const data = await response.json();
                
                if (data.success && data.prompt) {
                    document.getElementById('systemPromptSelect').value = data.prompt.id;
                }
            } catch (error) {
                console.error('Failed to load last used prompt:', error);
            }
        }

        // System Prompt 변경
        document.getElementById('systemPromptSelect').addEventListener('change', async (e) => {
            const promptId = e.target.value;
            if (promptId) {
                await updateSystemPrompt(promptId);
            }
        });

        // System Prompt 업데이트
        async function updateSystemPrompt(promptId) {
            try {
                // 프롬프트 내용 가져오기 (로깅용)
                let basePrompt = null;
                if (promptId) {
                    const promptResponse = await fetch(`${API_BASE}/api/system-prompts/${promptId}`);
                    const promptData = await promptResponse.json();
                    if (promptData.success) {
                        basePrompt = promptData.prompt.content;
                    }
                }
                
                // 프롬프트 엔지니어링 로그 출력
                console.group('🔧 System Prompt 업데이트');
                console.log('📝 원본 System Prompt:', basePrompt || '(기본 프롬프트)');
                console.log('🛠️ Function Calling 안내 포함: 서버에서 자동 추가됨');
                console.log('🆔 Session ID:', currentSessionId);
                console.groupEnd();
                
                // 서버에 업데이트 요청 (서버에서 Function Calling 안내를 자동으로 추가함)
                const response = await fetch(`${API_BASE}/api/chat/update-system-prompt?session_id=${currentSessionId}&system_prompt_id=${promptId}`);
                const data = await response.json();
                
                if (data.success) {
                    // 사용 기록 저장
                    await fetch(`${API_BASE}/api/system-prompts/usage?session_id=${currentSessionId}&system_prompt_id=${promptId}`, {
                        method: 'POST'
                    });
                }
            } catch (error) {
                console.error('Failed to update system prompt:', error);
            }
        }

        // System Prompt를 Function Calling 안내로 감싸기
        function wrapSystemPromptWithToolInstructions(basePrompt) {
            if (!basePrompt) {
                return null;
            }
            
            const toolInstructions = `

중요: 사용자가 데이터 조회나 API 호출을 요청하면 반드시 제공된 함수를 사용해야 합니다. 일반적인 응답으로 대체하지 마세요.

사용 가능한 함수:
1. get_users_list: 사용자가 "사용자 목록", "사용자 리스트", "사용자 목록 보여줘", "사용자 조회" 등을 요청할 때 사용
2. get_user_profile: 사용자가 "사용자 프로필", "사용자 정보", "사용자 상세" 등을 요청할 때 사용 (user_id 필요)
3. get_user_relationships: 사용자가 "사용자 관계", "관계 정보" 등을 요청할 때 사용 (user_id 필요)

규칙:
- 사용자가 데이터 조회를 요청하면 반드시 해당 함수를 호출하세요
- 함수를 사용할 수 있는 경우 일반적인 응답으로 대체하지 마세요
- 함수 호출 결과를 받은 후 사용자에게 명확하게 전달하세요`;
            
            return basePrompt + toolInstructions;
        }

        // 메시지 전송
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            // 사용자 메시지 표시
            addMessage('user', message);
            input.value = '';
            autoResize(input);
            
            // 입력 비활성화
            input.disabled = true;
            document.getElementById('sendButton').disabled = true;
            
            // 선택된 System Prompt ID 가져오기
            const promptSelect = document.getElementById('systemPromptSelect');
            const promptId = promptSelect.value;
            
            try {
                // System Prompt 내용 가져오기
                let systemPrompt = null;
                if (promptId) {
                    const promptResponse = await fetch(`${API_BASE}/api/system-prompts/${promptId}`);
                    const promptData = await promptResponse.json();
                    if (promptData.success) {
                        systemPrompt = promptData.prompt.content;
                        // 사용 기록 저장
                        await fetch(`${API_BASE}/api/system-prompts/usage?session_id=${currentSessionId}&system_prompt_id=${promptId}`, {
                            method: 'POST'
                        });
                    }
                }
                
                // Function Calling 안내로 감싸기
                const wrappedSystemPrompt = wrapSystemPromptWithToolInstructions(systemPrompt);
                
                // 프롬프트 엔지니어링 로그 출력
                console.group('🔧 프롬프트 엔지니어링 정보');
                console.log('📝 원본 System Prompt:', systemPrompt || '(기본 프롬프트 사용)');
                console.log('🛠️ Function Calling 안내 포함:', wrappedSystemPrompt ? '예' : '아니오');
                if (wrappedSystemPrompt) {
                    console.log('📋 최종 System Prompt (일부):', wrappedSystemPrompt.substring(0, 200) + '...');
                }
                console.log('💬 사용자 메시지:', message);
                console.log('🆔 Session ID:', currentSessionId);
                console.groupEnd();
                
                // 채팅 API 호출 (Function Calling 지원 - /api/chat 사용)
                const response = await fetch(`${API_BASE}/api/chat`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: message,
                        session_id: currentSessionId,
                        system_prompt: wrappedSystemPrompt
                    })
                });
                
                if (!response.ok) {
                    throw new Error('Failed to send message');
                }
                
                const data = await response.json();
                
                // 응답 로그
                console.log('✅ API 응답:', {
                    success: data.success,
                    response_length: data.response?.length || 0,
                    session_id: data.session_id,
                    model: data.model,
                    iterations: data.iterations
                });
                
                // 서버는 'response' 필드를 반환하므로 'response' 또는 'message' 모두 확인
                const responseText = data.response || data.message;
                
                if (data.success && responseText) {
                    addMessage('assistant', responseText);
                } else {
                    console.error('❌ 응답 실패:', data);
                    addMessage('assistant', '죄송합니다. 응답을 생성하는데 실패했습니다.');
                }
            } catch (error) {
                console.error('❌ 메시지 전송 실패:', error);
                addMessage('assistant', '죄송합니다. 오류가 발생했습니다.');
            } finally {
                input.disabled = false;
                document.getElementById('sendButton').disabled = false;
                input.focus();
            }
        }

        // 메시지 추가
        function addMessage(role, text) {
            const container = document.getElementById('chatContainer');
            const messageDiv = document.createElement('div');
            const messageId = 'msg-' + Date.now() + '-' + Math.random();
            messageDiv.id = messageId;
            messageDiv.className = `message ${role}`;
            
            const avatar = role === 'user' ? 'U' : 'AI';
            const avatarBg = role === 'user' ? '#19c37d' : '#ab68ff';
            
            messageDiv.innerHTML = `
                <div class="message-content">
                    <div class="message-avatar">${avatar}</div>
                    <div class="message-text">${escapeHtml(text)}</div>
                </div>
            `;
            
            container.appendChild(messageDiv);
            container.scrollTop = container.scrollHeight;
            
            return messageId;
        }

        // 메시지에 텍스트 추가 (스트리밍용)
        function appendToMessage(messageId, text) {
            const messageDiv = document.getElementById(messageId);
            if (messageDiv) {
                const textDiv = messageDiv.querySelector('.message-text');
                textDiv.textContent += text;
                document.getElementById('chatContainer').scrollTop = document.getElementById('chatContainer').scrollHeight;
            }
        }

        // HTML 이스케이프
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 키보드 이벤트 처리
        function handleKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        // 텍스트 영역 자동 크기 조정
        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 200) + 'px';
        }

        // 음성 인터페이스 토글
        function toggleVoiceInterface() {
            const checkbox = document.getElementById('voiceInterfaceToggle');
            const voiceInterface = document.getElementById('voiceInterface');
            
            if (checkbox.checked) {
                voiceInterface.classList.add('active');
            } else {
                voiceInterface.classList.remove('active');
                if (isRecording) {
                    stopRecording();
                }
            }
        }

        // 음성 녹음 토글
        async function toggleVoiceRecording() {
            if (isRecording) {
                stopRecording();
            } else {
                await startRecording();
            }
        }

        // 녹음 시작
        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                
                mediaRecorder.ondataavailable = (event) => {
                    audioChunks.push(event.data);
                };
                
                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    await sendVoiceMessage(audioBlob);
                    stream.getTracks().forEach(track => track.stop());
                };
                
                mediaRecorder.start();
                isRecording = true;
                
                const button = document.getElementById('voiceRecordButton');
                button.textContent = '⏹ 녹음 중지';
                button.classList.add('recording');
                document.getElementById('voiceStatus').textContent = '녹음 중...';
            } catch (error) {
                console.error('Failed to start recording:', error);
                alert('마이크 권한이 필요합니다.');
            }
        }

        // 녹음 중지
        function stopRecording() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                isRecording = false;
                
                const button = document.getElementById('voiceRecordButton');
                button.textContent = '🎤 음성 입력';
                button.classList.remove('recording');
                document.getElementById('voiceStatus').textContent = '처리 중...';
            }
        }

        // 음성 메시지 전송
        async function sendVoiceMessage(audioBlob) {
            try {
                const formData = new FormData();
                formData.append('audio', audioBlob, 'recording.webm');
                
                const promptSelect = document.getElementById('systemPromptSelect');
                const promptId = promptSelect.value;
                let systemPrompt = null;
                
                if (promptId) {
                    const promptResponse = await fetch(`${API_BASE}/api/system-prompts/${promptId}`);
                    const promptData = await promptResponse.json();
                    if (promptData.success) {
                        systemPrompt = promptData.prompt.content;
                    }
                }
                
                // 프롬프트 엔지니어링 로그 출력
                console.group('🔧 음성 메시지 - 프롬프트 엔지니어링 정보');
                console.log('📝 원본 System Prompt:', systemPrompt || '(기본 프롬프트 사용)');
                console.log('🛠️ Function Calling 안내: 서버에서 자동 추가됨');
                console.log('🆔 Session ID:', currentSessionId);
                console.groupEnd();
                
                const response = await fetch(`${API_BASE}/api/voice/process?session_id=${currentSessionId}`, {
                    method: 'POST',
                    body: formData
                });
                
                if (!response.ok) {
                    throw new Error('Failed to process voice');
                }
                
                const data = await response.json();
                
                if (data.success) {
                    // 사용자 메시지 표시
                    addMessage('user', data.user_text || '(음성 입력)');
                    
                    // AI 응답 표시
                    addMessage('assistant', data.assistant_text);
                    
                    // 음성 재생
                    if (data.audio_base64) {
                        playAudio(data.audio_base64);
                    }
                }
                
                document.getElementById('voiceStatus').textContent = '대기 중...';
            } catch (error) {
                console.error('Failed to send voice message:', error);
                document.getElementById('voiceStatus').textContent = '오류 발생';
            }
        }

        // 오디오 재생
        function playAudio(base64Audio) {
            const audio = new Audio('data:audio/mpeg;base64,' + base64Audio);
            audio.play();
        }

        // 프롬프트 관리 모달 열기
        async function openPromptManager() {
            document.getElementById('promptManagerModal').classList.add('active');
            await loadPromptList();
        }

        // 프롬프트 관리 모달 닫기
        function closePromptManager() {
            document.getElementById('promptManagerModal').classList.remove('active');
        }

        // 프롬프트 목록 로드
        async function loadPromptList() {
            try {
                const response = await fetch(`${API_BASE}/api/system-prompts`);
                const data = await response.json();
                
                const list = document.getElementById('promptList');
                
                if (data.success && data.prompts.length > 0) {
                    list.innerHTML = data.prompts.map(prompt => `
                        <div class="prompt-item">
                            <div class="prompt-info">
                                <div class="prompt-name">${escapeHtml(prompt.name)}${prompt.is_default ? ' (기본)' : ''}</div>
                                <div class="prompt-description">${escapeHtml(prompt.description || '')}</div>
                            </div>
                            <div class="prompt-actions">
                                <button onclick="editPrompt(${prompt.id})">편집</button>
                                <button onclick="deletePrompt(${prompt.id})">삭제</button>
                                <button onclick="selectPrompt(${prompt.id})">선택</button>
                            </div>
                        </div>
                    `).join('');
                } else {
                    list.innerHTML = '<div style="text-align: center; color: #8e8ea0; padding: 40px;">등록된 프롬프트가 없습니다.</div>';
                }
            } catch (error) {
                console.error('Failed to load prompt list:', error);
                document.getElementById('promptList').innerHTML = '<div style="text-align: center; color: #ef4444; padding: 40px;">로드 실패</div>';
            }
        }

        // 프롬프트 선택
        function selectPrompt(promptId) {
            document.getElementById('systemPromptSelect').value = promptId;
            updateSystemPrompt(promptId);
            closePromptManager();
        }

        // 프롬프트 편집
        async function editPrompt(promptId) {
            try {
                const response = await fetch(`${API_BASE}/api/system-prompts/${promptId}`);
                const data = await response.json();
                
                if (data.success) {
                    editingPromptId = promptId;
                    document.getElementById('promptFormTitle').textContent = '프롬프트 편집';
                    document.getElementById('promptName').value = data.prompt.name;
                    document.getElementById('promptContent').value = data.prompt.content;
                    document.getElementById('promptDescription').value = data.prompt.description || '';
                    document.getElementById('promptIsDefault').checked = data.prompt.is_default;
                    document.getElementById('promptFormModal').classList.add('active');
                }
            } catch (error) {
                console.error('Failed to load prompt:', error);
            }
        }

        // 프롬프트 삭제
        async function deletePrompt(promptId) {
            if (!confirm('정말 삭제하시겠습니까?')) return;
            
            try {
                const response = await fetch(`${API_BASE}/api/system-prompts/${promptId}`, {
                    method: 'DELETE'
                });
                const data = await response.json();
                
                if (data.success) {
                    await loadPromptList();
                    await loadSystemPrompts();
                }
            } catch (error) {
                console.error('Failed to delete prompt:', error);
            }
        }

        // 프롬프트 작성 폼 열기
        function openPromptForm() {
            editingPromptId = null;
            document.getElementById('promptFormTitle').textContent = '새 프롬프트 작성';
            document.getElementById('promptForm').reset();
            document.getElementById('promptFormModal').classList.add('active');
        }

        // 프롬프트 작성 폼 닫기
        function closePromptForm() {
            document.getElementById('promptFormModal').classList.remove('active');
            editingPromptId = null;
        }

        // 프롬프트 저장
        async function savePrompt(event) {
            event.preventDefault();
            
            const name = document.getElementById('promptName').value;
            const content = document.getElementById('promptContent').value;
            const description = document.getElementById('promptDescription').value;
            const isDefault = document.getElementById('promptIsDefault').checked;
            
            try {
                let response;
                if (editingPromptId) {
                    response = await fetch(`${API_BASE}/api/system-prompts/${editingPromptId}`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            name,
                            content,
                            description,
                            is_default: isDefault
                        })
                    });
                } else {
                    response = await fetch(`${API_BASE}/api/system-prompts`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            name,
                            content,
                            description,
                            is_default: isDefault
                        })
                    });
                }
                
                const data = await response.json();
                
                if (data.success) {
                    closePromptForm();
                    await loadPromptList();
                    await loadSystemPrompts();
                }
            } catch (error) {
                console.error('Failed to save prompt:', error);
            }
        }

        // 모달 외부 클릭 시 닫기
        document.getElementById('promptManagerModal').addEventListener('click', (e) => {
            if (e.target.id === 'promptManagerModal') {
                closePromptManager();
            }
        });

        document.getElementById('promptFormModal').addEventListener('click', (e) => {
            if (e.target.id === 'promptFormModal') {
                closePromptForm();
            }
        });
    </script>
</body>
</html>
