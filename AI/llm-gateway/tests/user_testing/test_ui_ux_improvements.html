<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI/UX 개선 사항 테스트</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .test-section {
            margin: 20px 0;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }
        
        .test-section h2 {
            color: #333;
            margin-bottom: 15px;
        }
        
        .test-result {
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
            font-family: monospace;
        }
        
        .test-result.pass {
            background: #d4edda;
            color: #155724;
        }
        
        .test-result.fail {
            background: #f8d7da;
            color: #721c24;
        }
        
        .summary {
            margin-top: 30px;
            padding: 20px;
            background: #e7f3ff;
            border-radius: 10px;
            border-left: 4px solid #007bff;
        }
        
        .summary h3 {
            margin-bottom: 15px;
            color: #004085;
        }
        
        .summary-stats {
            display: flex;
            gap: 20px;
            margin: 15px 0;
        }
        
        .stat-item {
            flex: 1;
            padding: 15px;
            background: white;
            border-radius: 8px;
            text-align: center;
        }
        
        .stat-item .label {
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
        }
        
        .stat-item .value {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }
        
        button {
            padding: 12px 30px;
            margin: 5px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background: #28a745;
            color: white;
            transition: all 0.3s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        #testOutput {
            max-height: 500px;
            overflow-y: auto;
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 UI/UX 개선 사항 테스트</h1>
        <p style="text-align: center; color: #666; margin-bottom: 30px;">
            test_alfred_voice.html과 test_voiceprint_management.html의 업데이트된 기능 테스트
        </p>
        
        <div style="text-align: center; margin-bottom: 30px;">
            <button onclick="runTests()" id="runBtn">▶️ 테스트 실행</button>
            <button onclick="clearResults()" id="clearBtn">🗑️ 결과 지우기</button>
        </div>
        
        <div class="summary" id="summary" style="display: none;">
            <h3>📊 테스트 결과 요약</h3>
            <div class="summary-stats">
                <div class="stat-item">
                    <div class="label">총 테스트</div>
                    <div class="value" id="totalTests">0</div>
                </div>
                <div class="stat-item">
                    <div class="label">통과</div>
                    <div class="value" id="passedTests" style="color: #28a745;">0</div>
                </div>
                <div class="stat-item">
                    <div class="label">실패</div>
                    <div class="value" id="failedTests" style="color: #dc3545;">0</div>
                </div>
                <div class="stat-item">
                    <div class="label">성공률</div>
                    <div class="value" id="successRate">0%</div>
                </div>
            </div>
        </div>
        
        <div class="test-section">
            <h2>테스트 출력</h2>
            <div id="testOutput"></div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:8000';
        
        let testResults = {
            passed: [],
            failed: [],
            total: 0
        };
        
        function log(message, type = 'info') {
            const output = document.getElementById('testOutput');
            const timestamp = new Date().toLocaleTimeString('ko-KR');
            const color = type === 'pass' ? '#4caf50' : type === 'fail' ? '#f44336' : '#2196f3';
            output.innerHTML += `<div style="color: ${color};">[${timestamp}] ${message}</div>`;
            output.scrollTop = output.scrollHeight;
        }
        
        function assert(condition, message) {
            testResults.total++;
            if (condition) {
                testResults.passed.push(message);
                log(`✅ PASS: ${message}`, 'pass');
                return true;
            } else {
                testResults.failed.push(message);
                log(`❌ FAIL: ${message}`, 'fail');
                return false;
            }
        }
        
        async function testAPIConnection() {
            log('\n=== API 연결 테스트 ===', 'info');
            try {
                const response = await fetch(`${API_BASE_URL}/`);
                const data = await response.json();
                assert(response.ok, 'API 서버 연결 성공');
                assert(data.status === 'running', '서버 상태 확인');
                assert(data.services !== undefined, '서비스 정보 확인');
            } catch (error) {
                assert(false, `API 연결 실패: ${error.message}`);
            }
        }
        
        async function testKeywordCheckAPI() {
            log('\n=== 키워드 확인 API 테스트 ===', 'info');
            try {
                const response = await fetch(`${API_BASE_URL}/api/keyword/check`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        stt_result: 'alfred',
                        base_keyword: 'alfred',
                        session_id: 'test_session'
                    })
                });
                
                const data = await response.json();
                assert(response.ok, '키워드 확인 API 호출 성공');
                assert(data.hasOwnProperty('is_keyword'), 'is_keyword 필드 존재');
                assert(data.hasOwnProperty('activate'), 'activate 필드 존재');
                assert(data.hasOwnProperty('similarity'), 'similarity 필드 존재');
            } catch (error) {
                assert(false, `키워드 확인 API 테스트 실패: ${error.message}`);
            }
        }
        
        async function testVoiceprintListAPI() {
            log('\n=== 음성 지문 조회 API 테스트 ===', 'info');
            try {
                const response = await fetch(`${API_BASE_URL}/api/keyword/voiceprint`);
                const data = await response.json();
                assert(response.ok, '음성 지문 조회 API 호출 성공');
                assert(data.hasOwnProperty('success'), 'success 필드 존재');
                assert(data.hasOwnProperty('voiceprints'), 'voiceprints 필드 존재');
                assert(Array.isArray(data.voiceprints), 'voiceprints가 배열임');
            } catch (error) {
                assert(false, `음성 지문 조회 API 테스트 실패: ${error.message}`);
            }
        }
        
        async function testVoiceprintRegisterAPI() {
            log('\n=== 음성 지문 등록 API 테스트 ===', 'info');
            try {
                const testData = {
                    base_keyword: 'alfred',
                    stt_keyword: 'test_stt_' + Date.now(),
                    audio_data: null,
                    session_id: 'test_session_' + Date.now()
                };
                
                const response = await fetch(`${API_BASE_URL}/api/keyword/voiceprint/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(testData)
                });
                
                const data = await response.json();
                assert(response.ok, '음성 지문 등록 API 호출 성공');
                assert(data.hasOwnProperty('success'), 'success 필드 존재');
                assert(data.hasOwnProperty('voiceprint_id'), 'voiceprint_id 필드 존재');
                assert(data.hasOwnProperty('is_new'), 'is_new 필드 존재');
            } catch (error) {
                assert(false, `음성 지문 등록 API 테스트 실패: ${error.message}`);
            }
        }
        
        function testAlfredVoiceFeatures() {
            log('\n=== test_alfred_voice.html 기능 테스트 ===', 'info');
            
            const activationDuration = 5 * 60 * 1000;
            assert(typeof activationDuration === 'number', '활성화 시간 설정 타입 확인');
            assert(activationDuration > 0, '활성화 시간이 양수임');
            
            const warningTime = activationDuration * 0.8;
            assert(warningTime === 4 * 60 * 1000, '경고 시간 계산 정확성 (4분)');
            
            let sessionActive = false;
            sessionActive = true;
            assert(sessionActive === true, '세션 활성화 상태 설정');
            
            sessionActive = false;
            assert(sessionActive === false, '세션 비활성화 상태 설정');
        }
        
        function testVoiceprintManagementFeatures() {
            log('\n=== test_voiceprint_management.html 기능 테스트 ===', 'info');
            
            let registrationState = 'idle';
            const validStates = ['idle', 'recording', 'processing', 'completed'];
            assert(validStates.includes(registrationState), '등록 상태가 유효한 값임');
            
            const sttKeyword = 'test_keyword';
            const isRecording = false;
            const isProcessing = false;
            
            const canRegister = sttKeyword && registrationState === 'idle' && !isRecording && !isProcessing;
            assert(canRegister === true, '등록 버튼 활성화 조건 확인');
            
            const canReset = true;
            assert(canReset === true, '초기화 버튼은 항상 활성화');
            
            const canNewRegistration = registrationState === 'idle' && !isRecording && !isProcessing;
            assert(canNewRegistration === true, '새로 등록 버튼 활성화 조건 확인');
        }
        
        async function testIntegrationFlow() {
            log('\n=== 통합 테스트: 키워드 확인 → 음성 지문 등록 → 조회 ===', 'info');
            
            try {
                const checkResponse = await fetch(`${API_BASE_URL}/api/keyword/check`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        stt_result: 'alfred',
                        base_keyword: 'alfred',
                        session_id: 'integration_test'
                    })
                });
                const checkData = await checkResponse.json();
                assert(checkResponse.ok, '통합 테스트: 키워드 확인 성공');
                
                const registerResponse = await fetch(`${API_BASE_URL}/api/keyword/voiceprint/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        base_keyword: 'alfred',
                        stt_keyword: 'integration_test_' + Date.now(),
                        session_id: 'integration_test'
                    })
                });
                const registerData = await registerResponse.json();
                assert(registerResponse.ok, '통합 테스트: 음성 지문 등록 성공');
                
                const listResponse = await fetch(`${API_BASE_URL}/api/keyword/voiceprint?base_keyword=alfred`);
                const listData = await listResponse.json();
                assert(listResponse.ok, '통합 테스트: 음성 지문 조회 성공');
                assert(listData.voiceprints.length > 0, '통합 테스트: 등록된 음성 지문이 목록에 있음');
            } catch (error) {
                assert(false, `통합 테스트 실패: ${error.message}`);
            }
        }
        
        async function runTests() {
            document.getElementById('runBtn').disabled = true;
            document.getElementById('testOutput').innerHTML = '';
            testResults = { passed: [], failed: [], total: 0 };
            
            log('='.repeat(60), 'info');
            log('UI/UX 개선 사항 테스트 시작', 'info');
            log('='.repeat(60), 'info');
            
            await testAPIConnection();
            await testKeywordCheckAPI();
            await testVoiceprintListAPI();
            await testVoiceprintRegisterAPI();
            testAlfredVoiceFeatures();
            testVoiceprintManagementFeatures();
            await testIntegrationFlow();
            
            // 결과 요약 표시
            const summary = document.getElementById('summary');
            summary.style.display = 'block';
            document.getElementById('totalTests').textContent = testResults.total;
            document.getElementById('passedTests').textContent = testResults.passed.length;
            document.getElementById('failedTests').textContent = testResults.failed.length;
            const successRate = ((testResults.passed.length / testResults.total) * 100).toFixed(1);
            document.getElementById('successRate').textContent = successRate + '%';
            
            log('\n' + '='.repeat(60), 'info');
            log(`총 테스트: ${testResults.total}`, 'info');
            log(`✅ 통과: ${testResults.passed.length}`, 'pass');
            log(`❌ 실패: ${testResults.failed.length}`, testResults.failed.length > 0 ? 'fail' : 'info');
            log(`성공률: ${successRate}%`, 'info');
            
            if (testResults.failed.length > 0) {
                log('\n실패한 테스트:', 'fail');
                testResults.failed.forEach((msg, idx) => {
                    log(`  ${idx + 1}. ${msg}`, 'fail');
                });
            }
            
            document.getElementById('runBtn').disabled = false;
        }
        
        function clearResults() {
            document.getElementById('testOutput').innerHTML = '';
            document.getElementById('summary').style.display = 'none';
            testResults = { passed: [], failed: [], total: 0 };
        }
    </script>
</body>
</html>
