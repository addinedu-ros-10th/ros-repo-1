[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=src
    --cov-report=term-missing
    --cov-report=html
markers =
    unit: 단위 테스트
    integration: 통합 테스트
    e2e: E2E 테스트
    slow: 느린 테스트 (스킵 가능)

